name: Build installers

# Builds the double-clickable app for Windows, macOS, and Linux on each
# platform's own runner, then attaches the files to a GitHub Release.
#
# How to cut a release that people can download:
#   1. Bump "version" in package.json (e.g. 1.0.1).
#   2. Commit, then tag it:  git tag v1.0.1 && git push origin v1.0.1
#   3. This workflow runs and publishes the installers on the Releases page.
#
# You can also trigger it by hand from the Actions tab (Run workflow) to get
# the files as downloadable build artifacts without publishing a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run dist
        env:
          # We ship an unsigned build (no paid developer certificate), so tell
          # electron-builder not to go looking for one on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oohnana-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: ignore

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          fail_on_unmatched_files: false
