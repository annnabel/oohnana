<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oohnana — cozy loop preview</title>
    <style>
      :root {
        --cream: #fbf7f0;
        --card: #ffffff;
        --ink: #4a4239;
        --ink-soft: #8a7d6f;
        --pink: #ff9db4;
        --pink-soft: #ffe0ea;
        --line: #efe6da;
        --stage: #fdf8f2;
        --shadow: 30px 40px rgba(120, 92, 66, 0.16);
        --dot: rgba(120, 92, 66, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --cream: #221d1a;
          --card: #2c2521;
          --ink: #f3e9df;
          --ink-soft: #b3a597;
          --pink: #ff9db4;
          --pink-soft: #5a3a44;
          --line: #3a312c;
          --stage: #2c2521;
          --shadow: 30px 46px rgba(0, 0, 0, 0.5);
          --dot: rgba(255, 224, 234, 0.18);
        }
      }
      :root[data-theme="light"] {
        --cream: #fbf7f0; --card: #ffffff; --ink: #4a4239; --ink-soft: #8a7d6f;
        --pink-soft: #ffe0ea; --line: #efe6da; --stage: #fdf8f2;
        --shadow: 30px 40px rgba(120, 92, 66, 0.16); --dot: rgba(120, 92, 66, 0.22);
      }
      :root[data-theme="dark"] {
        --cream: #221d1a; --card: #2c2521; --ink: #f3e9df; --ink-soft: #b3a597;
        --pink-soft: #5a3a44; --line: #3a312c; --stage: #2c2521;
        --shadow: 30px 46px rgba(0, 0, 0, 0.5); --dot: rgba(255, 224, 234, 0.18);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(120% 90% at 50% -10%, color-mix(in srgb, var(--pink-soft) 55%, var(--cream)) 0%, var(--cream) 55%);
        color: var(--ink);
        font-family: "Hiragino Maru Gothic ProN", "Segoe UI Rounded", "SF Pro Rounded",
          ui-rounded, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 40px 20px 64px;
        text-align: center;
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 0 0 10px;
      }
      h1 {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }
      .sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 30px; }

      /* Stage — a soft polaroid the poses live inside. */
      .stage {
        position: relative;
        width: 300px;
        height: 300px;
        margin: 0 auto;
        border-radius: 34px;
        background:
          radial-gradient(120% 120% at 50% 12%, color-mix(in srgb, var(--pink-soft) 40%, var(--stage)) 0%, var(--stage) 62%);
        box-shadow: 0 var(--shadow), inset 0 0 0 1.5px var(--line);
        overflow: hidden;
      }
      /* faint dotted texture so the empty space feels intentional */
      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(var(--dot) 1px, transparent 1.4px);
        background-size: 18px 18px;
        opacity: 0.5;
        pointer-events: none;
      }
      .stage img {
        position: absolute;
        inset: 12%;
        width: 76%;
        height: 76%;
        object-fit: contain;
        opacity: 0;
        transform: scale(0.965) translateY(4px);
        transition: opacity var(--fade) ease, transform calc(var(--hold) + var(--fade)) cubic-bezier(0.22, 1, 0.36, 1);
        mix-blend-mode: multiply;
      }
      @media (prefers-color-scheme: dark) { .stage img { mix-blend-mode: normal; } }
      :root[data-theme="dark"] .stage img { mix-blend-mode: normal; }
      :root[data-theme="light"] .stage img { mix-blend-mode: multiply; }
      .stage img.on {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      @media (prefers-reduced-motion: reduce) {
        .stage img { transition: opacity 0.2s linear; transform: none; }
        .stage img.on { transform: none; }
      }

      /* Pose caption chip pinned to the stage */
      .caption {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 13px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--card) 86%, transparent);
        backdrop-filter: blur(6px);
        box-shadow: 0 4px 14px rgba(80, 60, 40, 0.14);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .caption .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--pink);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--pink) 26%, transparent);
      }

      /* Affirmation bubble */
      .bubble {
        position: relative;
        margin: 26px auto 0;
        display: inline-block;
        max-width: 300px;
        padding: 12px 18px;
        border-radius: 20px 20px 20px 6px;
        background: var(--card);
        border: 1.5px solid var(--pink-soft);
        box-shadow: 0 10px 24px rgba(80, 60, 40, 0.12);
        font-size: 14.5px;
        font-weight: 600;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }

      .controls {
        margin-top: 30px;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 13px;
      }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        background: var(--pink);
        color: #3a2a30;
        cursor: pointer;
        box-shadow: 0 6px 16px color-mix(in srgb, var(--pink) 55%, transparent);
        transition: transform 0.15s ease, filter 0.15s ease;
      }
      button:hover { filter: brightness(1.04); transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      button:focus-visible { outline: 3px solid color-mix(in srgb, var(--pink) 60%, transparent); outline-offset: 2px; }
      label { display: inline-flex; align-items: center; gap: 9px; color: var(--ink-soft); font-weight: 600; }
      input[type="range"] { accent-color: var(--pink); cursor: pointer; }
      input[type="range"]:focus-visible { outline: 2px solid var(--pink); outline-offset: 4px; }

      /* Pose filmstrip — the 5 real frames of the loop */
      .strip {
        margin: 34px auto 0;
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .strip button {
        all: unset;
        cursor: pointer;
        width: 52px; height: 52px;
        border-radius: 15px;
        background: var(--card) center/72% no-repeat;
        box-shadow: inset 0 0 0 1.5px var(--line);
        opacity: 0.55;
        transition: opacity 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }
      .strip button:hover { opacity: 0.85; transform: translateY(-2px); }
      .strip button.active {
        opacity: 1;
        box-shadow: inset 0 0 0 2px var(--pink), 0 6px 14px color-mix(in srgb, var(--pink) 40%, transparent);
      }
      .strip button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

      .note {
        margin: 30px auto 0;
        max-width: 340px;
        font-size: 12px;
        line-height: 1.65;
        color: var(--ink-soft);
      }
      .note code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        background: color-mix(in srgb, var(--pink-soft) 50%, var(--card));
        padding: 1px 5px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">desktop buddy · cozy loop</p>
      <h1>oohnana 🐹</h1>
      <p class="sub">your uploaded poses, cross-faded into one gentle loop</p>

      <div class="stage" id="stage" aria-label="animation preview">
        <div class="caption"><span class="dot"></span><span id="cap">waking wiggle</span></div>
      </div>

      <div class="bubble" id="bubble">you're doing great ✨</div>

      <div class="controls">
        <button id="toggle" aria-label="pause or play the loop">⏸ pause</button>
        <label>
          speed
          <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="playback speed" />
        </label>
      </div>

      <div class="strip" id="strip" role="group" aria-label="jump to a pose"></div>

      <p class="note">
        Five real frames — two are live GIFs (the wiggle and the wander), three
        are held poses. Tap a frame to jump, or reorder the <code>FRAMES</code>
        array to re-sequence the loop.
      </p>
    </div>

    <script>
      const FRAMES = [
        { src: "../9903d79a5d46a354efc22cf39551569b.gif", cap: "waking wiggle" },
        { src: "../AdorableCutieChiikawa.webp", cap: "arms-up hello" },
        { src: "../a578d9499607489c0124cc5fba613c23.jpg", cap: "ice-cream break" },
        { src: "../f0535e902a3b0dabb4d9dfe53bc0e219%20%281%29.gif", cap: "off to wander" },
        { src: "../7f99d389a599ce0da9382b697269e1e1.jpg", cap: "cozy rest" }
      ];

      const AFFIRMATIONS = [
        "you're doing great ✨",
        "take a deep breath 💛",
        "your pace is the right pace",
        "proud of you for showing up",
        "be gentle with yourself",
        "someone is glad you exist",
        "rest counts as progress 🌿",
      ];

      const HOLD = 2400; // ms a frame stays fully visible
      const FADE = 700;  // ms cross-fade between frames

      const stage = document.getElementById("stage");
      const cap = document.getElementById("cap");
      const bubble = document.getElementById("bubble");
      const toggleBtn = document.getElementById("toggle");
      const speed = document.getElementById("speed");
      const strip = document.getElementById("strip");

      document.documentElement.style.setProperty("--hold", HOLD + "ms");
      document.documentElement.style.setProperty("--fade", FADE + "ms");

      // Build stage images + filmstrip thumbnails from the same source list.
      const imgs = FRAMES.map((f, i) => {
        const im = new Image();
        im.src = f.src;
        im.alt = f.cap;
        im.decoding = "async";
        if (i === 0) im.classList.add("on");
        stage.insertBefore(im, stage.firstChild);

        const thumb = document.createElement("button");
        thumb.style.backgroundImage = `url("${f.src}")`;
        thumb.title = f.cap;
        thumb.setAttribute("aria-label", f.cap);
        if (i === 0) thumb.classList.add("active");
        thumb.addEventListener("click", () => goTo(i));
        strip.appendChild(thumb);
        return im;
      });
      const thumbs = [...strip.children];

      let idx = 0;
      let playing = true;
      let timer = null;

      function paint() {
        imgs.forEach((im, i) => im.classList.toggle("on", i === idx));
        thumbs.forEach((t, i) => t.classList.toggle("active", i === idx));
        cap.textContent = FRAMES[idx].cap;
        bubble.style.opacity = "0";
        bubble.style.transform = "translateY(4px)";
        setTimeout(() => {
          bubble.textContent =
            AFFIRMATIONS[Math.floor(Math.random() * AFFIRMATIONS.length)];
          bubble.style.opacity = "1";
          bubble.style.transform = "translateY(0)";
        }, 260);
      }

      function step() {
        idx = (idx + 1) % imgs.length;
        paint();
      }

      function goTo(i) {
        idx = i;
        paint();
        schedule();
      }

      function schedule() {
        clearTimeout(timer);
        if (!playing) return;
        const mult = parseFloat(speed.value) || 1;
        timer = setTimeout(() => {
          step();
          schedule();
        }, (HOLD + FADE) / mult);
      }

      toggleBtn.addEventListener("click", () => {
        playing = !playing;
        toggleBtn.textContent = playing ? "⏸ pause" : "▶ play";
        schedule();
      });
      speed.addEventListener("input", schedule);

      schedule();
    </script>
  </body>
</html>
